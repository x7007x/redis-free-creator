name: Create Redis Free Account

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  create-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PX_PROFILE_DIR: ${{ github.workspace }}/.redis-px-profile
      RESULT_FILE: ${{ github.workspace }}/redis_new_account.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright redis
          playwright install chromium --with-deps

      - name: Warm up PX session on cloud.redis.io
        run: |
          python3 - <<'EOF'
          import time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              ctx = pw.chromium.launch_persistent_context(
                  "${{ env.PX_PROFILE_DIR }}", headless=True,
                  args=["--disable-blink-features=AutomationControlled"],
                  viewport={"width": 1366, "height": 768})
              page = ctx.new_page()
              page.goto("https://cloud.redis.io/", wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(6000)
              page.wait_for_timeout(2000)
              ctx.close()
          print("PX warmup done, profile saved to ${{ env.PX_PROFILE_DIR }}")
          EOF

      - name: Create mailbox, register, activate, get URL
        run: python3 redis_full_cycle.py

      - name: Verify the connection
        run: python3 redis_full_cycle.py test

      - name: Read result
        id: result
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('${{ env.RESULT_FILE }}'))
          for k in ['email', 'password', 'url']:
              print(f"{k}={d[k]}")
          EOF

      - name: Upload account file
        uses: actions/upload-artifact@v4
        with:
          name: redis-account
          path: ${{ env.RESULT_FILE }}
          retention-days: 5

      - name: Write workflow summary
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('${{ env.RESULT_FILE }}'))
          summary = f"""
          ## Redis Free Account Created

          | Item | Value |
          | --- | --- |
          | Email | `{d['email']}` |
          | Redis password | `{d['password']}` |
          | Mailbox password | `{d['mailbox_password']}` |
          | Storage URL | `{d['url']}` |
          | Database | {d['db']['name']} v{d['db']['version']} |
          """
          open('${{ github.workspace }}/SUMMARY.md', 'w').write(summary)
          EOF
          cat ${{ github.workspace }}/SUMMARY.md >> $GITHUB_STEP_SUMMARY
