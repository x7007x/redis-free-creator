name: Create Redis Free Account

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  create-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PX_PROFILE_DIR: ${{ github.workspace }}/.redis-px-profile
      RESULT_FILE: ${{ github.workspace }}/redis_new_account.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/chromium
          key: pw-chromium-${{ runner.os }}

      - name: Install python dependencies
        run: python -m pip install playwright redis requests

      - name: Install chromium browser
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Restore PX profile from release asset
        run: |
          mkdir -p "${{ env.PX_PROFILE_DIR }}"
          ASSET_URL=$(gh api repos/${{ github.repository }}/releases/tags/px-profile-v1 --jq '.assets[0].url')
          gh api "$ASSET_URL" --header "Accept: application/octet-stream" > /tmp/px-profile.tar.gz
          tar -xzf /tmp/px-profile.tar.gz -C "${{ env.PX_PROFILE_DIR }}" --strip-components=1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create mailbox, register, activate, get URL
        run: python redis_full_cycle.py

      - name: Verify the connection
        run: python redis_full_cycle.py test

      - name: Read result
        id: result
        run: |
          python - <<'EOF'
          import json
          d = json.load(open('${{ env.RESULT_FILE }}'))
          for k in ['email', 'password', 'url']:
              print(f"{k}={d[k]}")
          EOF

      - name: Upload account file
        uses: actions/upload-artifact@v4
        with:
          name: redis-account
          path: ${{ env.RESULT_FILE }}
          retention-days: 5

      - name: Write workflow summary
        run: |
          python - <<'EOF'
          import json
          d = json.load(open('${{ env.RESULT_FILE }}'))
          summary = f"""
          ## Redis Free Account Created

          | Item | Value |
          | --- | --- |
          | Email | `{d['email']}` |
          | Redis password | `{d['password']}` |
          | Mailbox password | `{d['mailbox_password']}` |
          | Storage URL | `{d['url']}` |
          | Database | {d['db']['name']} v{d['db']['version']} |
          """
          open('${{ github.workspace }}/SUMMARY.md', 'w').write(summary)
          EOF
          cat ${{ github.workspace }}/SUMMARY.md >> $GITHUB_STEP_SUMMARY
